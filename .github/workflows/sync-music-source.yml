name: sync-music-source
# 一次性：把工程内的 1.3.3 音源同步进仓库（跑完自动删除本文件）
on:
  push:
    paths:
      - '.github/workflows/sync-music-source.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SRC: "https://aka.doubaocdn.com/s/6aeDS5mxsH"
      EXPECT_SIZE: "42289"
      EXPECT_SHA256: "77c8d3fdc3bb17a14379b321fbc4ca8ca31e1928fcb7890285179c6dfb6ca0af"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 拉取并校验
        run: |
          set -e
          curl -fsSL --retry 3 -A "YYZONE/1.0" "$SRC" -o /tmp/music.js
          sz=$(wc -c < /tmp/music.js | tr -d ' ')
          echo "size=$sz"
          test "$sz" = "$EXPECT_SIZE"
          echo "$EXPECT_SHA256  /tmp/music.js" | sha256sum -c -
          node --check /tmp/music.js
          grep -q '@version 1.3.3' /tmp/music.js
      - name: 提交产物
        run: |
          set -e
          cp /tmp/music.js yyzone-music-source.js
          cp /tmp/music.js 'YY Zone音源.js'
          git config user.name 'yyzone-bot'
          git config user.email 'bot@yyzone.local'
          git add yyzone-music-source.js 'YY Zone音源.js'
          if git diff --cached --quiet; then
            echo '产物无变化，跳过提交'
          else
            git commit -m 'chore(music): 同步音源 1.3.3（酷狗官方 128k 主链 / 网易链路体检）'
            git pull --rebase --autostash -q origin main || true
            git push
          fi
      - name: 清理一次性 workflow
        run: |
          set -e
          git rm --quiet .github/workflows/sync-music-source.yml
          git commit -m 'chore: 移除一次性同步 workflow [skip ci]'
          git pull --rebase --autostash -q origin main || true
          git push
