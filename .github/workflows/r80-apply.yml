name: r80-apply

on:
  push:
    paths:
      - ".github/workflows/r80-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch payload
        run: |
          set -e
          curl -fsSL --retry 3 "https://aka.doubaocdn.com/s/TRVkiFo7k5" -o cms_families.json
          curl -fsSL --retry 3 "https://aka.doubaocdn.com/s/uSRVxm3RdV" -o yyzone-sources.json
          node -e "const f=require('./cms_families.json');const s=require('./yyzone-sources.json');if(f.length!==17)throw new Error('bad families '+f.length);if(s.count!==20)throw new Error('bad sources '+s.count);console.log('payload ok families='+f.length+' sources='+s.count)"

      - name: Commit
        run: |
          git config user.name "yyzone-bot"
          git config user.email "yyzone-bot@users.noreply.github.com"
          git add cms_families.json yyzone-sources.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "feat(cms): 新增 最大资源 / iqiyi 两族（播放器内实播验证通过）"
            git push
          fi

      - name: Self remove
        if: always()
        run: |
          git rm -f .github/workflows/r80-apply.yml || true
          git commit -m "chore: 删除一次性推送脚本" || true
          git push || true
